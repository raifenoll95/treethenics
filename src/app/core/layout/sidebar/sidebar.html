<aside class="sidebar">
  <a
    class="sidebar__brand"
    routerLink="/"
    aria-label="Go to Exercise Tree"
  >
    <img
      class="sidebar__brand-logo"
      src="/images/logo/treethenics-logo.png"
      alt="Treethenics"
    />
  </a>

  <nav class="sidebar__nav" aria-label="Main navigation">
    <a
      class="sidebar__item"
      routerLink="/"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="sidebar__icon">◆</span>
      <span>Tree</span>
    </a>

    <a
      class="sidebar__item"
      routerLink="/what-should-i-train"
      routerLinkActive="sidebar__item--active"
    >
      <span class="sidebar__icon">◎</span>
      <span class="sidebar__label-desktop">What should I train?</span>
      <span class="sidebar__label-mobile">Train</span>
    </a>

    <a
      class="sidebar__item"
      routerLink="/search"
      routerLinkActive="sidebar__item--active"
    >
      <span class="sidebar__icon">⌕</span>
      <span class="sidebar__label-desktop">Search Exercises</span>
      <span class="sidebar__label-mobile">Search</span>
    </a>

    <a
      class="sidebar__item"
      routerLink="/compare"
      routerLinkActive="sidebar__item--active"
    >
      <span class="sidebar__icon">⇄</span>
      <span class="sidebar__label-desktop">Compare Exercises</span>
      <span class="sidebar__label-mobile">Compare</span>
    </a>

    <a
      class="sidebar__item"
      routerLink="/about"
      routerLinkActive="sidebar__item--active"
    >
      <span class="sidebar__icon">◉</span>
      <span>About Me</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <span>Explore your limits.</span>
  </div>
</aside>
