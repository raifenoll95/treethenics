<aside class="sidebar">
  <a
    class="sidebar__brand"
    routerLink="/"
    aria-label="Go to Treethenics home"
  >
    <img
      class="sidebar__brand-logo"
      [src]="logoUrl"
      alt="Treethenics"
    />
  </a>

  <nav class="sidebar__nav" aria-label="Main navigation">
    <!-- HOME -->
    <a
      class="sidebar__item"
      routerLink="/"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="m3 10 9-7 9 7" />
        <path d="M5 9v12h14V9" />
        <path d="M9 21v-8h6v8" />
      </svg>

      <span>Home</span>
    </a>

    <!-- TREE -->
    <a
      class="sidebar__item"
      routerLink="/tree"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle cx="6" cy="5" r="3" />
        <circle cx="6" cy="19" r="3" />
        <circle cx="18" cy="6" r="3" />
        <path d="M6 8v8M18 9a9 9 0 0 1-9 9" />
      </svg>

      <span>Tree</span>
    </a>

    <!-- TRAIN -->
    <a
      class="sidebar__item"
      routerLink="/train"
      routerLinkActive="sidebar__item--active"
      ariaCurrentWhenActive="page"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="m6.5 6.5 11 11M4 9l5-5M15 20l5-5" />
        <path d="m2 7 5-5M17 22l5-5M3 3l2 2M19 19l2 2" />
      </svg>

      <span>Library</span>
    </a>

    <!-- COMPARE -->
    <a
      class="sidebar__item"
      routerLink="/compare"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M3 7h18m-4-4 4 4-4 4" />
        <path d="M21 17H3m4-4-4 4 4 4" />
      </svg>

      <span>Compare</span>
    </a>

    <!-- ABOUT -->
    <a
      class="sidebar__item"
      routerLink="/about"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="10" />
        <circle cx="12" cy="9" r="3" />
        <path d="M5.5 19a7 7 0 0 1 13 0" />
      </svg>

      <span>About Me</span>
    </a>

    <!-- PRO -->
    <a
      class="sidebar__item sidebar__item--pro"
      routerLink="/pro"
      routerLinkActive="sidebar__item--pro-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z" />
        <path d="M20 2v4m-2-2h4" />
      </svg>

      <span>PRO</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <span>Explore your limits.</span>
  </div>
</aside>
