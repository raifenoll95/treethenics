<aside class="sidebar">
  <a
      class="sidebar__brand"
      routerLink="/"
      aria-label="Go to Treethenics home"
    >
      <img
        class="sidebar__brand-logo"
        [src]="logoUrl"
        alt="Treethenics"
      />
    </a>

  <nav class="sidebar__nav" aria-label="Main navigation">

    <a
      class="sidebar__item"
      routerLink="/"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="sidebar__icon">
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 11.5 12 4l9 7.5" />
          <path d="M5.5 10v9h13v-9" />
          <path d="M9.5 19v-5h5v5" />
        </svg>
      </span>

      <span>Home</span>
    </a>

    <a
      class="sidebar__item"
      routerLink="/tree"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="sidebar__icon">◆</span>
      <span>Tree</span>
    </a>

    <a
      class="sidebar__item"
      routerLink="/what-should-i-train"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="sidebar__icon">◎</span>
      <span class="sidebar__label-desktop">Train</span>
      <span class="sidebar__label-mobile">Train</span>
    </a>

    <a
      class="sidebar__item"
      routerLink="/compare"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="sidebar__icon">⇄</span>
      <span class="sidebar__label-desktop">Compare</span>
      <span class="sidebar__label-mobile">Compare</span>
    </a>

    <a
      class="sidebar__item"
      routerLink="/about"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="sidebar__icon">◉</span>
      <span>About Me</span>
    </a>

    <a
      class="sidebar__item sidebar__item--pro"
      routerLink="/pro"
      routerLinkActive="sidebar__item--pro-active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="sidebar__icon" aria-hidden="true">✦</span>
      <span>PRO</span>
    </a>
  </nav>

  <div class="sidebar__footer">
    <span>Explore your limits.</span>
  </div>
</aside>
