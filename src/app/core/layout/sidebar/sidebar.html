<aside
  class="sidebar"
  [class.sidebar--menu-open]="mobileMenuOpen()"
  (keydown.escape)="closeMobileMenu(); menuToggle.focus()"
>
  <div class="sidebar__topbar">
    <!-- BOTÓN DEL MENÚ MÓVIL -->
    <button
      #menuToggle
      class="sidebar__menu-toggle"
      type="button"
      aria-controls="treethenics-navigation"
      [attr.aria-expanded]="mobileMenuOpen()"
      [attr.aria-label]="mobileMenuOpen() ? 'Close menu' : 'Open menu'"
      (click)="toggleMobileMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- LOGO: EN MÓVIL SOLO SE MUESTRA EN HOME -->
    <a
      class="sidebar__brand"
      [routerLink]="isSpanish ? '/es' : '/'"
      routerLinkActive="sidebar__brand--home"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Go to Treethenics home"
      (click)="closeMobileMenu()"
    >
      <img
        class="sidebar__brand-logo"
        [src]="logoUrl"
        alt="Treethenics"
      />
    </a>
  </div>

  <nav
    id="treethenics-navigation"
    class="sidebar__nav"
    aria-label="Main navigation"
    (click)="closeMobileMenu()"
  >
    <!-- HOME -->
    <a
      class="sidebar__item"
      [routerLink]="isSpanish ? '/es' : '/'"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="m3 10 9-7 9 7" />
        <path d="M5 9v12h14V9" />
        <path d="M9 21v-8h6v8" />
      </svg>

      	<span>{{ isSpanish ? 'Inicio' : 'Home' }}</span>
    </a>

    <!-- TREE -->
    <a
      class="sidebar__item"
      [routerLink]="isSpanish ? '/tree/es' : '/tree'"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle cx="6" cy="5" r="3" />
        <circle cx="6" cy="19" r="3" />
        <circle cx="18" cy="6" r="3" />
        <path d="M6 8v8M18 9a9 9 0 0 1-9 9" />
      </svg>

      <span>{{ isSpanish ? 'Árbol' : 'Tree' }}</span>
    </a>

    <!-- LIBRARY -->
    <a
      class="sidebar__item"
      [routerLink]="isSpanish ? '/train/es' : '/train'"
      [class.sidebar__item--active]="isLibraryActive"
      [attr.aria-current]="isLibraryActive ? 'page' : null"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="m6.5 6.5 11 11M4 9l5-5M15 20l5-5" />
        <path d="m2 7 5-5M17 22l5-5M3 3l2 2M19 19l2 2" />
      </svg>

      <span>{{ isSpanish ? 'Biblioteca' : 'Library' }}</span>
    </a>

    <!-- COMPARE -->
    <a
      class="sidebar__item"
      [routerLink]="isSpanish ? '/compare/es' : '/compare'"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }"
      ariaCurrentWhenActive="page"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M3 7h18m-4-4 4 4-4 4" />
        <path d="M21 17H3m4-4-4 4 4 4" />
      </svg>

      	<span>{{ isSpanish ? 'Comparar' : 'Compare' }}</span>
    </a>

    <!-- ABOUT -->
    <a
      class="sidebar__item"
      [routerLink]="isSpanish ? '/about/es' : '/about'"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="10" />
        <circle cx="12" cy="9" r="3" />
        <path d="M5.5 19a7 7 0 0 1 13 0" />
      </svg>

      <span>{{ isSpanish ? 'Sobre mí' : 'About Me' }}</span>
    </a>

    <!-- PRO -->
    <a
      class="sidebar__item sidebar__item--pro"
      [routerLink]="isSpanish ? '/pro/es' : '/pro'"
      routerLinkActive="sidebar__item--pro-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <svg
        class="sidebar__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"
        />
        <path d="M20 2v4m-2-2h4" />
      </svg>

      <span>PRO</span>
    </a>

    <div
      class="sidebar__languages"
      role="group"
      [attr.aria-label]="isSpanish ? 'Idioma' : 'Language'"
    >
      <a
        class="sidebar__language"
        [class.sidebar__language--active]="!isSpanish"
        [routerLink]="englishPath"
        queryParamsHandling="preserve"
        [preserveFragment]="true"
        [attr.aria-current]="!isSpanish ? 'page' : null"
        aria-label="English"
        title="English"
        lang="en"
        hreflang="en"
      >
        <svg viewBox="0 0 60 36" aria-hidden="true" focusable="false">
          <rect width="60" height="36" fill="#012169" />
          <path d="M0 0 60 36M60 0 0 36" stroke="#fff" stroke-width="7" />
          <path
            d="m0 0 30 18h-5L0 3z M60 0 30 18v-3L55 0z
              M60 36 30 18h5l25 15z M0 36l30-18v3L5 36z"
            fill="#c8102e"
          />
          <path d="M30 0v36M0 18h60" stroke="#fff" stroke-width="12" />
          <path d="M30 0v36M0 18h60" stroke="#c8102e" stroke-width="7" />
        </svg>
      </a>

      <a
        class="sidebar__language"
        [class.sidebar__language--active]="isSpanish"
        [class.sidebar__language--disabled]="!hasSpanishVersion"
        [routerLink]="spanishPath"
        queryParamsHandling="preserve"
        [preserveFragment]="true"
        [attr.aria-current]="isSpanish ? 'page' : null"
        [attr.aria-disabled]="hasSpanishVersion ? null : 'true'"
        [attr.title]="hasSpanishVersion ? 'Español' : 'Traducción pendiente'"
        aria-label="Español"
        lang="es"
        hreflang="es"
      >
        <svg viewBox="0 0 60 36" aria-hidden="true" focusable="false">
          <rect width="60" height="36" fill="#aa151b" />
          <rect y="9" width="60" height="18" fill="#f1bf00" />
        </svg>
      </a>
    </div>
  </nav>

  <div class="sidebar__footer">
    <span>{{ isSpanish ? 'Explora tus límites.' : 'Explore your limits.' }}</span>
  </div>
</aside>
