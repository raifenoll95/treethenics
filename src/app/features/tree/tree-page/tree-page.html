<section class="tree-page">
  <header class="tree-page__header">
    <div>
      <span class="tree-page__eyebrow">CALISTHENICS MAP</span>
      <h1>Exercise Tree</h1>
      <p>Explore exercises and discover how every movement connects.</p>
    </div>

    <div class="tree-page__actions">
      <button type="button" class="tree-page__action">
        Reset view
      </button>
    </div>
  </header>

  <div class="tree-canvas">
    <app-tree-canvas />

    <div class="tree-controls">
      <button type="button" aria-label="Zoom in">+</button>
      <button type="button" aria-label="Zoom out">−</button>
      <button type="button" aria-label="Reset view">⌂</button>
    </div>
  </div>
</section>
