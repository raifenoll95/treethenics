<div class="anatomy-viewer" role="img" [attr.aria-label]="muscleDescription()">
  <div class="anatomy-viewer__views" aria-hidden="true">
    @for (item of images(); track item.view) {
      <figure>
        <div class="anatomy-viewer__body" [style.aspect-ratio]="width + ' / ' + height">
          @for (image of item.images; track image.key) {
            <img [src]="image.src" [width]="width" [height]="height"
              alt="" decoding="async" draggable="false" />
          }
        </div>
        <figcaption>{{ item.label }}</figcaption>
      </figure>
    }
  </div>
  <div class="anatomy-viewer__legend" aria-hidden="true">
    <span><i class="primary"></i>Primary</span>
    <span><i class="secondary"></i>Secondary</span>
  </div>
</div>
